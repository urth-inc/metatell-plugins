<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>付箋ボード</title>
    <script>
      // どのパスで開かれても、相対パスをアプリの入口から解決する。
      // 入口は公開 URL なら /ext/{organizationId}/、ローカルなら /。
      {
        const base = document.createElement('base')
        base.href = (location.pathname.match(/^\/ext\/[^/]+/)?.[0] ?? '') + '/'
        document.head.append(base)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
